<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
        }

        .book-badge {
            display: inline-block;
            background-color: #ebf8ff;
            color: #2b6cb0;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .book-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .info-group {
            margin-bottom: 14px;
            font-size: 15px;
            line-height: 1.5;
            color: #4a5568;
        }

        .info-group strong {
            color: #2d3748;
        }

        .description-box {
            background-color: #f8fafc;
            border-left: 4px solid #3182ce;
            padding: 12px 16px;
            border-radius: 4px;
            margin: 20px 0;
            font-size: 14px;
            color: #4a5568;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-update {
            background-color: #3182ce;
            color: #ffffff;
        }

        .btn-update:hover {
            background-color: #2b6cb0;
        }

        .btn-delete {
            background-color: #e53e3e;
            color: #ffffff;
        }

        .btn-delete:hover {
            background-color: #c53030;
        }

        .btn-back {
            background-color: #edf2f7;
            color: #4a5568;
            margin-left: auto;
        }

        .btn-back:hover {
            background-color: #e2e8f0;
        }

        form {
            display: inline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="book-badge">Book #{{ book.id }}</div>
        <h1 class="book-title">{{ book.title }}</h1>

        <div class="info-group">
            <strong>Author:</strong> {{ book.Autor }}
        </div>
        <div class="info-group">
            <strong>Pages:</strong> {{ book.pages }}
        </div>
        <div class="info-group">
            <strong>Price:</strong> ${{ book.price }}
        </div>

        <div class="description-box">
            <strong>Description:</strong><br>
            {{ book.desc }}
        </div>

        <div class="actions">
            <a href="{% url 'book_update' book.id %}" class="btn btn-update">Update</a>

            <form method="POST" action="{% url 'book_delete' book.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-delete" onclick="return confirm('Вы уверены, что хотите удалить эту книгу?')">Delete</button>
            </form>

            <a href="{% url 'book' %}" class="btn btn-back">Back to Books</a>
        </div>
    </div>

</body>
</html>
